  deliverables:
  - 资源需求与预算
  status: pending
- id: go_to_market
  name: 市场策略
  type: task
  phase: PLAN
  owner: 分析师
  depends:
  - business_model
  deliverables:
  - GTM 策略文档
  status: pending
- id: risk_mitigation
  name: 风险缓解计划
  type: task
  phase: PLAN
  owner: 决策者
  depends:
  - resource_plan
  - go_to_market
  deliverables:
  - 风险缓解方案
